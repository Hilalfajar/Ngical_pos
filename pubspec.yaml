name: ngical
description: Ngical - Aplikasi Kasir Modern
publish_to: "none"
version: 1.1.36+36

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  file_picker: ^12.0.0
  share_plus: ^13.0.0
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.3.3
  archive: ^3.6.1
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  audioplayers: ^6.1.0
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.wav
    - assets/icon/app_icon.png
    - assets/icon/logo.jpg
